name: Verify and deploy Advent

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript
        run: npm run check
      - name: Test calendar behavior
        run: npm test
      - name: Check whether Pages is configured
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFile } from 'node:fs/promises';
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (!response.ok && response.status !== 404) throw new Error(`Pages API returned ${response.status}`);
          const config = response.ok ? await response.json() : null;
          const enabled = config?.build_type === 'workflow';
          await appendFile(process.env.GITHUB_OUTPUT, `enabled=${enabled}\n`);
          if (!enabled) {
            console.log('::notice::Checks passed. Enable Settings → Pages → Source: GitHub Actions, then run this workflow again.');
            await appendFile(process.env.GITHUB_STEP_SUMMARY, '## Website verified\n\nGitHub Pages is not configured for Actions yet. Open **Settings → Pages → Source: GitHub Actions**, then use **Run workflow**. No deployment was attempted.\n');
          }
          NODE
      - name: Read Pages configuration
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Collect public files
        if: steps.pages.outputs.enabled == 'true'
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -R assets css js _site/
      - name: Upload static website
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
