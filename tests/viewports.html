<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Advent · проверка экранов</title>
<style>body{margin:20px;background:#d7d9d5;color:#213d44;font:13px system-ui}header{display:flex;align-items:center;gap:15px;margin-bottom:20px}select,button{font:inherit;padding:6px}main{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}figure{margin:0}figcaption{margin-bottom:7px}iframe{border:0;box-shadow:0 5px 30px #0002;border-radius:8px;background:#132c39}</style>
<header><strong>Проверка реальных размеров iframe</strong><label>Открытка <select id="event"><option value="">Сегодня</option><option value="winter">Зима</option><option value="new-year">Новый год</option><option value="defender">23 февраля</option><option value="spring">Весна</option><option value="womens-day">8 Марта</option><option value="may-day">1 мая</option><option value="victory">9 мая</option><option value="summer">Лето</option><option value="russia">День России</option><option value="autumn">Осень</option><option value="knowledge">Знания</option><option value="unity">Единство</option><option value="birthday">День рождения</option></select></label><label>Режим <select id="mode"><option value="countdown">Ожидание</option><option value="celebration">Праздник</option></select></label><button id="refresh">Показать</button></header>
<main><figure><figcaption>390 × 844 · телефон</figcaption><iframe title="Телефон 390" width="390" height="844" src="../"></iframe></figure><figure><figcaption>360 × 640 · небольшой телефон</figcaption><iframe title="Телефон 360" width="360" height="640" src="../"></iframe></figure><figure><figcaption>768 × 1024 · планшет</figcaption><iframe title="Планшет 768" width="768" height="1024" src="../"></iframe></figure></main>
<script>document.getElementById('refresh').addEventListener('click',()=>{const event=document.getElementById('event').value,mode=document.getElementById('mode').value;for(const frame of document.querySelectorAll('iframe'))frame.src='../'+(event?'?preview='+encodeURIComponent(event)+'&mode='+mode:'');});</script></html>
